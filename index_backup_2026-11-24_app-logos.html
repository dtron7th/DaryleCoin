    <div class="View_Tool">
        <div class="View_Tool_Build" aria-label="View_Tool_Build">
            <button id="View_Tool_Border_Button" aria-label="View_Tool_Border_Button">Border</button>
            <button id="View_Tool_Labels_Button" aria-label="View_Tool_Labels_Button">Labels</button>
        </div>
        <style aria-label="View_Tool_Style">
            .View_Tool {
                position: fixed;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                z-index: 99999;
                display: none;
            }
            .View_Tool_Build > button {
                width: 50px;
                height: 20px;
            }
            .View_Tool_Build > button.View_Tool_On {
                border-color: #ff0000;
                color: #ff0000;
            }
            .View_Tool_Label {
                position: absolute;
                top: 0;
                left: 0;
                z-index: 99998;
                font: 14px monospace;
                color: #ffffff;
                background: #000000;
                padding: 0 4px;
                pointer-events: auto;
            }
            .View_Tool_Label > button {
                width: auto;
                height: auto;
                margin-left: 4px;
                font-size: 10px;
            }
        </style>
        <script aria-label="View_Tool_Script">
            (function () {
                var borderBtn = document.getElementById('View_Tool_Border_Button');
                var labelsBtn = document.getElementById('View_Tool_Labels_Button');
                var borderStyle = null, labelChips = [];

                function labelOf(el) {
                    return el.id ? '#' + el.id
                         : (el.className && typeof el.className === 'string' && el.className.trim())
                             ? '.' + el.className.trim().split(/\s+/)[0]
                             : el.tagName.toLowerCase();
                }

                function copyLabel(name, btn) {
                    var done = function () {
                        btn.textContent = 'ok';
                        setTimeout(function () { btn.textContent = 'copy'; }, 600);
                    };
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(name).then(done, done);
                    } else {
                        var ta = document.createElement('textarea');
                        ta.value = name;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        ta.remove();
                        done();
                    }
                }

                // Border: 1px solid red on every element
                borderBtn.addEventListener('click', function () {
                    if (borderStyle) {
                        borderStyle.remove();
                        borderStyle = null;
                    } else {
                        borderStyle = document.createElement('style');
                        borderStyle.textContent = 'body * { border: 1px solid red !important; }';
                        document.head.appendChild(borderStyle);
                    }
                    borderBtn.classList.toggle('View_Tool_On', !!borderStyle);
                });

                // Labels: stamp every element's name but show no tag;
                // Ctrl+Left Click on an element reveals/hides its tag
                var labelsArmed = false;

                function removeChip(entry) {
                    entry.chip.remove();
                    if (entry.madeRelative && entry.anchor) {
                        entry.anchor.style.position = '';
                    }
                }

                var voidTags = { area: 1, base: 1, br: 1, col: 1, embed: 1, hr: 1, img: 1, input: 1, link: 1, meta: 1, param: 1, source: 1, track: 1, wbr: 1 };

                function showChip(el) {
                    var name = el.getAttribute('data-view-tool-label');
                    var madeRelative = false;
                    var anchor = voidTags[el.tagName.toLowerCase()] ? el.parentElement : el;
                    if (anchor && getComputedStyle(anchor).position === 'static') {
                        anchor.style.position = 'relative';
                        madeRelative = true;
                    }
                    var chip = document.createElement('span');
                    chip.className = 'View_Tool_Label';
                    var text = document.createElement('span');
                    text.textContent = name;
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = 'copy';
                    btn.addEventListener('click', function (event) {
                        event.stopPropagation();
                        copyLabel(name, btn);
                    });
                    chip.appendChild(text);
                    chip.appendChild(btn);
                    if (anchor === el) {
                        try { el.prepend(chip); } catch (e) {}
                    } else if (anchor) {
                        el.before(chip);
                    }
                    labelChips.push({ el: el, chip: chip, anchor: anchor, madeRelative: madeRelative });
                }

                function revealLabel(event) {
                    if (event.target.closest && event.target.closest('.View_Tool_Label')) {
                        return;
                    }
                    // a click outside the label hides it
                    labelChips.forEach(removeChip);
                    labelChips = [];
                    if (!event.ctrlKey || event.button !== 0) {
                        return;
                    }
                    var el = event.target.closest
                        ? event.target.closest('[data-view-tool-label]')
                        : null;
                    if (!el) {
                        return;
                    }
                    event.preventDefault();
                    event.stopPropagation();
                    showChip(el);
                }

                labelsBtn.addEventListener('click', function () {
                    if (labelsArmed) {
                        labelChips.forEach(removeChip);
                        labelChips = [];
                        document.querySelectorAll('[data-view-tool-label]').forEach(function (el) {
                            el.removeAttribute('data-view-tool-label');
                        });
                        document.body.removeEventListener('click', revealLabel, true);
                        labelsArmed = false;
                    } else {
                        document.body.querySelectorAll('*').forEach(function (el) {
                            if (el.closest('.View_Tool')) {
                                return;
                            }
                            el.setAttribute('data-view-tool-label', labelOf(el));
                        });
                        document.body.addEventListener('click', revealLabel, true);
                        labelsArmed = true;
                    }
                    labelsBtn.classList.toggle('View_Tool_On', labelsArmed);
                });
            })();
        </script>
    </div>

                <!-- Background Slide Show Styles -->
                <style aria-label="Background_Slide_Show_Style">
                    .Background_Slide_Show {
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100dvw;
                        height: 100dvh;
                        
                    }
                    .Background_Slide_Show_Build {
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100dvw;
                        height: 100dvh;
                        object-fit: cover;
                    }

                    .Background_Slide_Show_Build > img {
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        object-fit: cover;
                        transition: opacity 1s ease;
                    }
                </style>
                <script aria-label="Background_Slide_Show_Script">
                    (function () {
                        var base = '/Images/Background_Slide_Show_Data/';
                        var slideMs = 10000;    // time each slide stays up
                        var refreshMs = 15000; // re-checks the folder for new photos
                        var imgExts = /\.(jpe?g|png|gif|webp|avif|bmp)$/i;

                        // used only when the server won't list the folder
                        // (Netlify, or opening index.html straight off disk).
                        var slides = [
                            '003e91723f082ed354129d996ed4d3ad.jpg',
                            '38139928099642512.jpg',
                            '927811960743055285.jpg',
                            'download (1).jpg',
                            'download (2).jpg',
                            'download.jpg',
                            'Wonderful autumn landscape.jpg',
                            '🌹beautiful flowers pic🌹.jpg'
                        ];

                        // every .Background_Slide_Show_Build on the page (main page + second page) shows the same slide
                        var shows = [];
                        var i = -1;

                        // two stacked layers per show: each tick the hidden one fades in on top
                        function setupShow(build) {
                            var layer0 = build.querySelector('img');
                            var layer1 = layer0.cloneNode(false);
                            layer1.removeAttribute('alt');
                            layer1.style.opacity = '0';
                            build.appendChild(layer1);
                            layer0.style.zIndex = '1';
                            layer1.style.zIndex = '2';
                            return { layers: [layer0, layer1], active: 0 };
                        }

                        function pickNext() {
                            var next_i;
                            do { next_i = Math.floor(Math.random() * slides.length); }
                            while (slides.length > 1 && next_i === i);
                            i = next_i;
                            shows.forEach(function (show) {
                                var layers = show.layers;
                                var next = 1 - show.active;
                                layers[next].src = base + encodeURIComponent(slides[i]);
                                layers[next].style.zIndex = '2';
                                layers[show.active].style.zIndex = '1';
                                layers[next].style.opacity = '1';
                                layers[show.active].style.opacity = '0';
                                show.active = next;
                            });
                        }

                        // read the folder's index page and pull every image
                        // name out of it — new photos join the show on their own
                        function refreshSlides() {
                            fetch(base).then(function (r) {
                                if (!r.ok) throw new Error('no listing');
                                return r.text();
                            }).then(function (html) {
                                var doc = new DOMParser().parseFromString(html, 'text/html');
                                var found = [];
                                doc.querySelectorAll('a[href]').forEach(function (a) {
                                    var name = decodeURIComponent(a.getAttribute('href')).split('/').pop();
                                    if (imgExts.test(name)) found.push(name);
                                });
                                if (found.length) {
                                    // preload anything new so fades never stall
                                    found.forEach(function (f2) {
                                        if (slides.indexOf(f2) === -1) {
                                            var im = new Image();
                                            im.src = base + encodeURIComponent(f2);
                                        }
                                    });
                                    slides = found;
                                }
                            }).catch(function () {});
                        }

                        // wait for the whole page so the second page's slide show is found too
                        document.addEventListener('DOMContentLoaded', function () {
                            shows = Array.prototype.map.call(document.querySelectorAll('.Background_Slide_Show_Build'), setupShow);
                            if (!shows.length) return;
                            refreshSlides();
                            pickNext();
                            setInterval(pickNext, slideMs);
                            setInterval(refreshSlides, refreshMs);
                        });
                    })();
                </script>

                <script aria-label="Logo_Script">
                    (function () {
                        var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

                        // 1s delay -> type the title (letters fade in) -> 1.0s delay -> overlapping 0.5s tile fades, 0.1s apart
                        window.Sozin_Section_Intro = function (titleSelector, tileSelector, typeMs) {
                            var title = document.querySelector(titleSelector);
                            var tiles = tileSelector ? document.querySelectorAll(tileSelector) : [];
                            var text = title.textContent;
                            title.textContent = '';
                            title.style.visibility = '';
                            var letters = Array.prototype.map.call(text, function (ch) {
                                var s = document.createElement('span');
                                s.textContent = ch;
                                s.style.opacity = '0';
                                s.style.transition = 'opacity 0.3s ease-in-out';
                                title.appendChild(s);
                                return s;
                            });
                            return wait(1000).then(function () {
                                var step = (typeMs || 100) / letters.length;
                                return letters.reduce(function (p, s) {
                                    return p.then(function () { s.style.opacity = '1'; return wait(step); });
                                }, Promise.resolve());
                            }).then(function () {
                                if (!tiles.length) { return wait(300); }
                                return wait(1000).then(function () {
                                    var stagger = 100;
                                    tiles.forEach(function (tile, i) {
                                        setTimeout(function () { tile.classList.add('Section_Intro_Shown'); }, i * stagger);
                                    });
                                    return wait(500 + (tiles.length - 1) * stagger);
                                });
                            });
                        };

                        // page title types in first (0.5s), then the Apps and Games sections follow
                        window.Sozin_Section_Intro('.Logo_Build > p', null, 500).then(function () {
                            document.dispatchEvent(new Event('Logo_Intro_Done'));
                        });
                    })();
                    
                </script>

            document.querySelector('.Shares_Title').style.visibility = 'hidden';
            document.querySelector('.Page_Down_Button').addEventListener('click', function () {
                window.Sozin_Section_Intro('.Shares_Title', null, 500).then(function () {
                    document.querySelector('.Shares_Sub_Title').classList.add('Section_Intro_Shown');
                    setTimeout(function () {
                        document.querySelector('.Road_Map_Button').classList.add('Section_Intro_Shown');
                        setTimeout(function () {
                            document.querySelector('.Shares_Deed').classList.add('Section_Intro_Shown');
                            setTimeout(function () {
                                document.querySelector('.Shares_Sliders').classList.add('Section_Intro_Shown');
                            }, 500);
                        }, 500);
                    }, 500);
                });
            }, { once: true });

            (function () {
                var valueSlider = document.querySelector('.Shares_Value_Slider');
                var valueLabel = document.querySelector('.Shares_Value_Label');
                var formatMoney = function (n) {
                    if (n >= 1000000) { return '$' + (n / 1000000).toFixed(1) + 'M'; }
                    if (n >= 1000) { return '$' + Math.round(n / 1000) + 'K'; }
                    return '$' + n;
                };
                var updateValue = function () {
                    var n = Number(valueSlider.value);
                    valueSlider.style.setProperty('--Slider_Ratio', n / Number(valueSlider.max));
                    valueLabel.textContent = formatMoney(n);
                };
                valueSlider.addEventListener('input', updateValue);
                updateValue();

                var donationGoal = 10000;
                var donationSlider = document.querySelector('.Shares_Donation_Slider');
                var donationLabel = document.querySelector('.Shares_Donation_Label');
                // call Sozin_Set_Donations(amount) with the total donated to move the donation slider
                window.Sozin_Set_Donations = function (amount) {
                    var n = Math.max(0, Math.min(Number(amount) || 0, donationGoal));
                    donationSlider.style.setProperty('--Slider_Ratio', n / donationGoal);
                    donationSlider.setAttribute('aria-valuenow', n);
                    donationLabel.textContent = '$' + n.toLocaleString('en-US') + '/$' + donationGoal.toLocaleString('en-US');
                };
                window.Sozin_Set_Donations(0);
            })();
        </script>

        </script>

        <div class="Div_Window Settings_Popup">
            <div class="Settings_Popup_Build" aria-label="Settings_Popup_Build">
                <button class="Settings_Popup_Web_Info_Button">
                    <span class="Settings_Popup_List_Icon">
                        <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="8"/></svg>
                    </span>
                    <span class="Settings_Popup_List_Text">Web Info</span>
                </button>
            </div>
            <style aria-label="Settings_Popup_Style">
                .Settings_Popup {
                    position: absolute;
                    top: 40px;
                    right: 30px;
                    width: 200px;
                    height: 300px;
                    backdrop-filter: var(--Glass_Backdrop_Filter);
                    -webkit-backdrop-filter: var(--Glass_Backdrop_Filter);
                    transform-origin: top right;
                    opacity: 0;
                    pointer-events: none;
                    transition: opacity 1s cubic-bezier(0, 1, 0, 1);
                    z-index: 6;
                }
                .Settings_Popup.Settings_Popup_Open {
                    transition-delay: 0.2s;
                    opacity: 1;
                    pointer-events: auto;
                }
                .Settings_Popup > .Settings_Popup_Build {
                    width: 100%;
                    height: 100%;
                    background: none;
                    border: none;
                }
                .Settings_Popup_Web_Info_Button {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    width: calc(100% - 20px);
                    height: 40px;
                    margin: 10px;
                    padding: 0 10px;
                    border: none;
                    border-radius: 10px;
                    background: transparent;
                    color: var(--Main_Text_Color);
                    cursor: var(--Main_Cursor);
                    font-size: var(--Font_Size-1);
                    text-align: left;
                    transition: background 0.2s;
                }
                .Settings_Popup_Web_Info_Button:hover {
                    background: var(--Main_UI_Background);
                }
                .Settings_Popup_Web_Info_Button:active {
                    transform: scale(0.98);
                }
                .Settings_Popup_List_Icon {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    flex-shrink: 0;
                    width: 30px;
                    height: 30px;
                    border-radius: 50%;
                    background: var(--Main_UI_Background);
                }
                .Settings_Popup_List_Text {
                    flex: 1;
                    font-weight: 600;
                }
            </style>
            <script aria-label="Settings_Popup_Script">
                (function () {
                    var button = document.querySelector('.Top_Right_Settings_Button');
                    var popup = document.querySelector('.Settings_Popup');
                    button.addEventListener('click', function (event) {
                        event.stopPropagation();
                        popup.classList.toggle('Settings_Popup_Open');
                    });
                    var webInfoButton = popup.querySelector('.Settings_Popup_Web_Info_Button');
                    var leftSection = document.querySelector('.Left_Section');
                    webInfoButton.addEventListener('click', function (event) {
                        event.stopPropagation();
                        leftSection.classList.toggle('Left_Section_Open');
                    });
                    popup.addEventListener('click', function (event) {
                        if (event.target.closest('button')) {
                            popup.classList.remove('Settings_Popup_Open');
                        }
                    }, true);
                    document.addEventListener('click', function (event) {
                        if (!popup.classList.contains('Settings_Popup_Open')) { return; }
                        if (popup.contains(event.target)) { return; }
                        popup.classList.remove('Settings_Popup_Open');
                    });
                })();
            </script>
        </div>
    </div>

        <div class="Kin_Flow_Build" aria-label="Kin_Flow_Build">

        </div>

            .Kin_Flow {
                display: none;
            }
        </style>

        </script>
    </div>
    
</body>
