    <div class="View_Tool">
        <div class="View_Tool_Build" aria-label="View_Tool_Build">
            <button id="View_Tool_Border_Button" aria-label="View_Tool_Border_Button">Border</button>
            <button id="View_Tool_Labels_Button" aria-label="View_Tool_Labels_Button">Labels</button>
        </div>
        <style aria-label="View_Tool_Style">
            .View_Tool {
                position: fixed;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                z-index: 99999;
                display: none;
            }
            .View_Tool_Build > button {
                width: 50px;
                height: 20px;
            }
            .View_Tool_Build > button.View_Tool_On {
                border-color: #ff0000;
                color: #ff0000;
            }
            .View_Tool_Label {
                position: absolute;
                top: 0;
                left: 0;
                z-index: 99998;
                font: 14px monospace;
                color: #ffffff;
                background: #000000;
                padding: 0 4px;
                pointer-events: auto;
            }
            .View_Tool_Label > button {
                width: auto;
                height: auto;
                margin-left: 4px;
                font-size: 10px;
            }
        </style>
        <script aria-label="View_Tool_Script">
            (function () {
                var borderBtn = document.getElementById('View_Tool_Border_Button');
                var labelsBtn = document.getElementById('View_Tool_Labels_Button');
                var borderStyle = null, labelChips = [];

                function labelOf(el) {
                    return el.id ? '#' + el.id
                         : (el.className && typeof el.className === 'string' && el.className.trim())
                             ? '.' + el.className.trim().split(/\s+/)[0]
                             : el.tagName.toLowerCase();
                }

                function copyLabel(name, btn) {
                    var done = function () {
                        btn.textContent = 'ok';
                        setTimeout(function () { btn.textContent = 'copy'; }, 600);
                    };
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(name).then(done, done);
                    } else {
                        var ta = document.createElement('textarea');
                        ta.value = name;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        ta.remove();
                        done();
                    }
                }

                // Border: 1px solid red on every element
                borderBtn.addEventListener('click', function () {
                    if (borderStyle) {
                        borderStyle.remove();
                        borderStyle = null;
                    } else {
                        borderStyle = document.createElement('style');
                        borderStyle.textContent = 'body * { border: 1px solid red !important; }';
                        document.head.appendChild(borderStyle);
                    }
                    borderBtn.classList.toggle('View_Tool_On', !!borderStyle);
                });

                // Labels: stamp every element's name but show no tag;
                // Ctrl+Left Click on an element reveals/hides its tag
                var labelsArmed = false;

                function removeChip(entry) {
                    entry.chip.remove();
                    if (entry.madeRelative && entry.anchor) {
                        entry.anchor.style.position = '';
                    }
                }

                var voidTags = { area: 1, base: 1, br: 1, col: 1, embed: 1, hr: 1, img: 1, input: 1, link: 1, meta: 1, param: 1, source: 1, track: 1, wbr: 1 };

                function showChip(el) {
                    var name = el.getAttribute('data-view-tool-label');
                    var madeRelative = false;
                    var anchor = voidTags[el.tagName.toLowerCase()] ? el.parentElement : el;
                    if (anchor && getComputedStyle(anchor).position === 'static') {
                        anchor.style.position = 'relative';
                        madeRelative = true;
                    }
                    var chip = document.createElement('span');
                    chip.className = 'View_Tool_Label';
                    var text = document.createElement('span');
                    text.textContent = name;
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = 'copy';
                    btn.addEventListener('click', function (event) {
                        event.stopPropagation();
                        copyLabel(name, btn);
                    });
                    chip.appendChild(text);
                    chip.appendChild(btn);
                    if (anchor === el) {
                        try { el.prepend(chip); } catch (e) {}
                    } else if (anchor) {
                        el.before(chip);
                    }
                    labelChips.push({ el: el, chip: chip, anchor: anchor, madeRelative: madeRelative });
                }

                function revealLabel(event) {
                    if (event.target.closest && event.target.closest('.View_Tool_Label')) {
                        return;
                    }
                    // a click outside the label hides it
                    labelChips.forEach(removeChip);
                    labelChips = [];
                    if (!event.ctrlKey || event.button !== 0) {
                        return;
                    }
                    var el = event.target.closest
                        ? event.target.closest('[data-view-tool-label]')
                        : null;
                    if (!el) {
                        return;
                    }
                    event.preventDefault();
                    event.stopPropagation();
                    showChip(el);
                }

                labelsBtn.addEventListener('click', function () {
                    if (labelsArmed) {
                        labelChips.forEach(removeChip);
                        labelChips = [];
                        document.querySelectorAll('[data-view-tool-label]').forEach(function (el) {
                            el.removeAttribute('data-view-tool-label');
                        });
                        document.body.removeEventListener('click', revealLabel, true);
                        labelsArmed = false;
                    } else {
                        document.body.querySelectorAll('*').forEach(function (el) {
                            if (el.closest('.View_Tool')) {
                                return;
                            }
                            el.setAttribute('data-view-tool-label', labelOf(el));
                        });
                        document.body.addEventListener('click', revealLabel, true);
                        labelsArmed = true;
                    }
                    labelsBtn.classList.toggle('View_Tool_On', labelsArmed);
                });
            })();
        </script>
    </div>

                <div class="Background_Slide_Show_Build" aria-label="Background_Slide_Show_Build">
                    <img src="/Images/Background_Slide_Show_Data/38139928099642512.jpg" alt="Background 1">

                <!-- Background Slide Show Styles -->
                <style aria-label="Background_Slide_Show_Style">
                    .Background_Slide_Show {
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100dvw;
                        height: 100dvh;
                        
                    }
                    .Background_Slide_Show_Build {
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100dvw;
                        height: 100dvh;
                        object-fit: cover;
                    }

                    .Background_Slide_Show_Build > img {
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        object-fit: cover;
                        transition: opacity 1s ease;
                    }
                </style>
                <script aria-label="Background_Slide_Show_Script">
                    (function () {
                        var base = '/Images/Background_Slide_Show_Data/';
                        var slideMs = 10000;    // time each slide stays up
                        var refreshMs = 15000; // re-checks the folder for new photos
                        var imgExts = /\.(jpe?g|png|gif|webp|avif|bmp)$/i;

                        // used only when the server won't list the folder
                        // (Netlify, or opening index.html straight off disk).
                        var slides = [
                            '003e91723f082ed354129d996ed4d3ad.jpg',
                            '38139928099642512.jpg',
                            '927811960743055285.jpg',
                            'download (1).jpg',
                            'download (2).jpg',
                            'download.jpg',
                            'Wonderful autumn landscape.jpg',
                            '🌹beautiful flowers pic🌹.jpg'
                        ];

                        var build = document.querySelector('.Background_Slide_Show_Build');
                        if (!build) return;

                        // two stacked layers: each tick the hidden one fades in on top
                        var layer0 = build.querySelector('img');
                        var layer1 = layer0.cloneNode(false);
                        layer1.removeAttribute('alt');
                        layer1.style.opacity = '0';
                        build.appendChild(layer1);
                        var layers = [layer0, layer1];

                        var i = -1, active = 0;
                        layers[0].style.zIndex = '1';
                        layers[1].style.zIndex = '2';

                        function pickNext() {
                            var next_i;
                            do { next_i = Math.floor(Math.random() * slides.length); }
                            while (slides.length > 1 && next_i === i);
                            i = next_i;
                            var next = 1 - active;
                            layers[next].src = base + encodeURIComponent(slides[i]);
                            layers[next].style.zIndex = '2';
                            layers[active].style.zIndex = '1';
                            layers[next].style.opacity = '1';
                            layers[active].style.opacity = '0';
                            active = next;
                        }

                        // read the folder's index page and pull every image
                        // name out of it — new photos join the show on their own
                        function refreshSlides() {
                            fetch(base).then(function (r) {
                                if (!r.ok) throw new Error('no listing');
                                return r.text();
                            }).then(function (html) {
                                var doc = new DOMParser().parseFromString(html, 'text/html');
                                var found = [];
                                doc.querySelectorAll('a[href]').forEach(function (a) {
                                    var name = decodeURIComponent(a.getAttribute('href')).split('/').pop();
                                    if (imgExts.test(name)) found.push(name);
                                });
                                if (found.length) {
                                    // preload anything new so fades never stall
                                    found.forEach(function (f2) {
                                        if (slides.indexOf(f2) === -1) {
                                            var im = new Image();
                                            im.src = base + encodeURIComponent(f2);
                                        }
                                    });
                                    slides = found;
                                }
                            }).catch(function () {});
                        }

                        refreshSlides();
                        pickNext();
                        setInterval(pickNext, slideMs);
                        setInterval(refreshSlides, refreshMs);
                    })();
                </script>
